name: basic
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: basic
      POSTGRES_PASSWORD: basic_local_only
      POSTGRES_DB: basic
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["basic-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basic -d basic"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  basic-data:
