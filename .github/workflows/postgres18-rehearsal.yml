name: PostgreSQL 18 synthetic rehearsal
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/rehearse-postgres-18.mjs
      - docs/postgres18-rehearsal.md
      - OPERATIONS.md
      - .github/workflows/postgres18-rehearsal.yml
      - deploy/db-init.sh
      - migrations/**
      - scripts/operator.ts
      - src/lib/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/rehearse-postgres-18.mjs

