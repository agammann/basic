name: Basic validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres18-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - run: node scripts/test-postgres18-guard.mjs
      - run: node scripts/test-postgres18-helper.mjs

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0', '26.13.1']
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: basic
          POSTGRES_PASSWORD: basic_ci_only
          POSTGRES_DB: basic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U basic -d basic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://basic:basic_ci_only@localhost:5432/basic
      TEST_DATABASE_URL: postgresql://basic:basic_ci_only@localhost:5432/basic_test
      APP_ORIGIN: http://localhost:3400
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=low
      - run: docker exec ${{ job.services.postgres.id }} createdb -U basic basic_test
      - run: pnpm db:migrate && pnpm catalog:curate
      - run: pnpm typecheck && pnpm test && pnpm evaluate && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser and SDK journeys
        run: |
          pnpm start > /tmp/basic-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3400/ready; then break; fi
            sleep 1
          done
          pnpm test:browser
          pnpm test:mcp
      - name: Search and profile acceptance
        run: |
          # Browser prefetches and API checks share one rate bucket. Start this
          # independent batch in a fresh minute without changing app limits.
          sleep $((61 - $(date +%-S)))
          pnpm test:acceptance
      - name: Recover HTTP search after a real PostgreSQL outage
        env:
          BASIC_DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          sleep $((61 - $(date +%-S)))
          node scripts/test-db-recovery.mjs
      - name: Disposable backup restoration
        env:
          BASIC_DB_CONTAINER: ${{ job.services.postgres.id }}
        run: pnpm backup:test
      - name: Container build and runtime checks
        run: |
          docker build --target runtime -t basic-runtime-review .
          docker build --target worker -t basic-worker-review .
          docker run --rm --network host -e DATABASE_URL basic-worker-review pnpm catalog:curate
          docker run --rm --network host -e DATABASE_URL basic-worker-review pnpm catalog:stale
          docker run -d --name basic-runtime-review --network host --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true -e DATABASE_URL -e APP_ORIGIN=http://localhost:3401 -e PORT=3401 basic-runtime-review
          trap 'docker logs basic-runtime-review; docker rm -f basic-runtime-review' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3401/ready; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          # The standalone process and container use the same database bucket.
          sleep $((61 - $(date +%-S)))
          TEST_BASE_URL=http://localhost:3401 pnpm test:mcp
          TEST_BASE_URL=http://localhost:3401 pnpm test:acceptance
      - name: Keep integration and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: basic-integration-evidence-node-${{ matrix.node }}
          path: |
            work/http-recovery.json
            reports/backup-restore.json
            /tmp/basic-server.log


  source:
    name: Package committed source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: basic
          POSTGRES_PASSWORD: basic_ci_only
          POSTGRES_DB: basic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U basic -d basic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://basic:basic_ci_only@localhost:5432/basic
      TEST_DATABASE_URL: postgresql://basic:basic_ci_only@localhost:5432/basic_test
      APP_ORIGIN: http://localhost:3400
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.19.0"
      - run: node scripts/package-release.mjs
      - name: Check source archive and checksum
        run: |
          cd release-artifacts
          sha256sum -c basic_*.zip.sha256
          unzip -t basic_*.zip
      - name: Extract a fresh source consumer outside the checkout
        run: |
          consumer_root=$(mktemp -d "$RUNNER_TEMP/basic-consumer.XXXXXX")
          unzip -q release-artifacts/basic_*_source.zip -d "$consumer_root"
          version=$(node -p "require('./package.json').version")
          consumer="$consumer_root/basic-$version"
          test -f "$consumer/pnpm-lock.yaml"
          test ! -e "$consumer/node_modules"
          test ! -e "$consumer/.git"
          echo "SOURCE_CONSUMER=$consumer" >> "$GITHUB_ENV"
      - run: npm install --global pnpm@11.19.0
      - name: Frozen install from the extracted archive
        working-directory: ${{ env.SOURCE_CONSUMER }}
        run: pnpm install --frozen-lockfile
      - run: docker exec ${{ job.services.postgres.id }} createdb -U basic basic_test
      - name: Build and test the extracted PostgreSQL consumer
        working-directory: ${{ env.SOURCE_CONSUMER }}
        run: |
          pnpm db:migrate && pnpm catalog:curate
          pnpm typecheck && pnpm test && pnpm evaluate && pnpm build
      - name: Smoke the extracted production server with the real SDK
        working-directory: ${{ env.SOURCE_CONSUMER }}
        run: |
          pnpm start > "$RUNNER_TEMP/basic-consumer-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node --input-type=module -e "for(let i=0;i<60;i++){try{const r=await fetch('http://localhost:3400/ready');if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,1000));}process.exit(1);"
          pnpm test:mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: basic-source
          path: |
            release-artifacts/basic_*_source.zip
            release-artifacts/basic_*_source.zip.sha256
          if-no-files-found: error
          overwrite: true

  caddy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate the pinned production proxy configuration
        run: |
          image=$(sed -n 's/^    image: \(caddy:.*\)$/\1/p' compose.production.yaml)
          test -n "$image"
          docker run --rm -e BASIC_DOMAIN=basic.example.test -v "$GITHUB_WORKSPACE/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  artifact-transfer:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download source artifact (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: basic-source
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Download source artifact (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: basic-source
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Download source artifact (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: basic-source
          path: release-artifacts
      - name: Verify transferred source checksum
        working-directory: release-artifacts
        run: sha256sum -c basic_*_source.zip.sha256
      - name: Exercise published-release guard with in-memory client
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const assert = require('node:assert/strict');
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const version = require('./package.json').version;
            const { default: publish } = await import(pathToFileURL(resolve('scripts/release.mjs')).href);
            const messages = [];
            const fixtureGithub = { rest: { repos: { listReleases() {} } }, paginate: async () => [{tag_name: 'v' + version, draft: false}] };
            const fixtureContext = {eventName: 'push', ref: 'refs/heads/main', sha: 'a'.repeat(40), repo: {owner: 'fixture', repo: 'fixture'}};
            await publish({github: fixtureGithub, context: fixtureContext, core: {info: message => messages.push(message)}});
            assert(messages.some(message => message.includes('already published; leaving it unchanged')));
            await assert.rejects(publish({github: fixtureGithub, context: {...fixtureContext, eventName: 'pull_request'}, core: {info() {}}}));
  artifact-missing-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe a nonexistent artifact
        id: missing
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: basic-nonexistent-transfer-guard
      - name: Reject unexpected success
        if: always() && steps.missing.outcome != 'failure'
        run: exit 1
  publish:
    name: Publish verified source release
    needs: [validate, source, caddy-validate, artifact-transfer, artifact-missing-guard, postgres18-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: basic-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download source artifact (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: basic-source
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Download source artifact (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: basic-source
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Download source artifact (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: basic-source
          path: release-artifacts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { default: publish } = await import(pathToFileURL(resolve('scripts/release.mjs')).href);
            await publish({ github, context, core });
